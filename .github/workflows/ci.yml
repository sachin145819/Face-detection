name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ML_ENABLE_DEEP: "false"
      DATABASE_URL: sqlite:///./test-ci.db
      SECRET_KEY: ci-secret-not-for-production
      STORAGE_DIR: ./storage-ci
      MODEL_CACHE_DIR: ./models_cache
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip wheel
          touch requirements-ml.txt
          # Install torch-family packages strictly from the CPU index first.
          grep -iE '^[[:space:]]*(torch|torchvision|torchaudio)([<>=!~ ;\[]|$)' requirements-ml.txt > /tmp/torch-reqs.txt || true
          if [ -s /tmp/torch-reqs.txt ]; then
            pip install --index-url https://download.pytorch.org/whl/cpu -r /tmp/torch-reqs.txt
          fi
          pip install -r requirements.txt

      - name: Run migrations (smoke test)
        run: |
          if [ -f alembic.ini ]; then alembic upgrade head; else echo "alembic.ini not found, skipping"; fi

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (if a lint script exists)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Build
        run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: truthlens-backend:ci
          # Skip baking model weights in CI (saves time + bandwidth).
          build-args: |
            PRELOAD_MODELS=false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: truthlens-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

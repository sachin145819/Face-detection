# TruthLens frontend — nginx (SPA + /api reverse proxy)
#
# This file is installed as /etc/nginx/templates/default.conf.template; the official
# nginx image runs envsubst on it at start-up, substituting ONLY variables that are
# defined in the environment:
#   BACKEND_UPSTREAM       host:port of the FastAPI service   (default backend:8000)
#   NGINX_LOCAL_RESOLVERS  auto-filled from /etc/resolv.conf  (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1)
# nginx's own runtime variables ($host, $uri, ...) are left untouched.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Resolve the backend lazily (via Docker's DNS) so nginx starts even if the
    # backend container is still booting / gets recreated with a new IP.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend_upstream ${BACKEND_UPSTREAM};

    # ---- compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml font/ttf font/otf;

    # ---- security headers -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API reverse proxy -> FastAPI ----------------------------------------
    location /api/ {
        # Backend caps images at MAX_UPLOAD_MB=10 and videos at MAX_VIDEO_MB=100; leave
        # headroom for multipart overhead and base64 restoration masks.
        client_max_body_size 110m;

        # No URI part => the original request URI (/api/...) is forwarded verbatim.
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Analysis runs synchronously (~15 s; first call longer while models load).
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # Interactive API docs served by FastAPI (optional convenience).
    location = /docs         { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }

    # ---- static assets (content-hashed by Vite) -> cache forever --------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- index.html must never be cached (it references the hashed bundles) ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ---- SPA fallback (client-side routing) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
